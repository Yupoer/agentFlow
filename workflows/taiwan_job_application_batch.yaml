{
  "name": "taiwan_job_application_batch",
  "description": "Draft per-job application materials after jobs are selected; side effects like submitting or sending are approval-gated.",
  "inputs": {
    "selected_jobs": {
      "required": true,
      "description": "Selected jobs as URLs, JSON, or Markdown list"
    },
    "resume_path": {
      "required": false,
      "default": "unknown"
    },
    "output_dir": {
      "required": false,
      "default": "/tmp/taiwan-job-application-batch"
    }
  },
  "summary": "Draft application batch for {{selected_jobs}} using resume {{resume_path}} into {{output_dir}}.",
  "artifacts": [
    "{{output_dir}}/application_batch.md",
    "{{output_dir}}/honesty_risk_report.md"
  ],
  "risks": [
    "Do not submit applications without approval",
    "Avoid overclaiming production experience"
  ],
  "steps": [
    {
      "id": "normalize_selected_jobs",
      "title": "Normalize selected jobs",
      "action": "Normalize selected jobs from {{selected_jobs}} and identify target positioning for each.",
      "owner": "hermes",
      "depends_on": [],
      "toolsets": [
        "file",
        "web",
        "browser"
      ],
      "expected_artifacts": [
        "normalized selected jobs"
      ],
      "verification": [
        "each selected job has source/url/company/role"
      ],
      "requires_approval": false,
      "approval_status": "not_required"
    },
    {
      "id": "draft_materials",
      "title": "Draft application materials",
      "action": "Draft 104 self-recommendations, cover letters, and resume adjustment notes into {{output_dir}}/application_batch.md.",
      "owner": "hermes",
      "depends_on": [
        "normalize_selected_jobs"
      ],
      "toolsets": [
        "file"
      ],
      "expected_artifacts": [
        "{{output_dir}}/application_batch.md"
      ],
      "verification": [
        "each draft is job-specific",
        "no overclaiming"
      ],
      "requires_approval": false,
      "approval_status": "not_required"
    },
    {
      "id": "verify_honesty_risk",
      "title": "Verify honesty risk",
      "action": "Write {{output_dir}}/honesty_risk_report.md identifying any claims that may overstate Go, Python, cloud, K8s, DevOps, or hand-coded experience.",
      "owner": "hermes",
      "depends_on": [
        "draft_materials"
      ],
      "toolsets": [
        "file"
      ],
      "expected_artifacts": [
        "{{output_dir}}/honesty_risk_report.md"
      ],
      "verification": [
        "risk report exists",
        "risky claims are rewritten or flagged"
      ],
      "requires_approval": false,
      "approval_status": "not_required"
    }
  ]
}
