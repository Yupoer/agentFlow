{
  "name": "taiwan_job_interview_prep",
  "description": "Generate a role-specific interview pack for a Taiwan software job using honest AI-assisted backend positioning.",
  "inputs": {
    "job_detail": {
      "required": true,
      "description": "Job URL, JD text, or structured job detail"
    },
    "interview_date": {
      "required": false,
      "default": "unknown"
    },
    "output_dir": {
      "required": false,
      "default": "/tmp/taiwan-job-interview-prep"
    }
  },
  "summary": "Prepare interview pack for {{job_detail}} with interview date {{interview_date}} into {{output_dir}}.",
  "artifacts": [
    "{{output_dir}}/interview_pack.md",
    "{{output_dir}}/self_intro.md",
    "{{output_dir}}/technical_qa.md",
    "{{output_dir}}/reverse_questions.md"
  ],
  "risks": [
    "Do not overclaim AI-assisted manual coding or production DevOps experience",
    "If JD is incomplete, mark assumptions"
  ],
  "steps": [
    {
      "id": "parse_job",
      "title": "Parse job detail",
      "action": "Parse {{job_detail}} into role, company, stack, requirements, interview risks, and unknowns.",
      "owner": "hermes",
      "depends_on": [],
      "toolsets": [
        "web",
        "browser",
        "file"
      ],
      "expected_artifacts": [
        "parsed job requirements"
      ],
      "verification": [
        "role/company/stack extracted or marked unknown"
      ],
      "requires_approval": false,
      "approval_status": "not_required"
    },
    {
      "id": "map_assets",
      "title": "Map user assets to JD",
      "action": "Map LogPulse, IssuesTracker, search/NLP coursework, and AI-assisted positioning to the JD. Identify risks in Go, Python, DevOps/cloud/K8s, and coding tests.",
      "owner": "hermes",
      "depends_on": [
        "parse_job"
      ],
      "toolsets": [
        "file"
      ],
      "expected_artifacts": [
        "asset-risk map"
      ],
      "verification": [
        "risks are explicit and not hidden"
      ],
      "requires_approval": false,
      "approval_status": "not_required"
    },
    {
      "id": "write_interview_pack",
      "title": "Write interview pack",
      "action": "Write self intro, project deep dives, technical Q&A, AI-assisted disclosure scripts, and reverse questions to {{output_dir}}/interview_pack.md and related files.",
      "owner": "hermes",
      "depends_on": [
        "map_assets"
      ],
      "toolsets": [
        "file"
      ],
      "expected_artifacts": [
        "{{output_dir}}/interview_pack.md",
        "{{output_dir}}/self_intro.md",
        "{{output_dir}}/technical_qa.md",
        "{{output_dir}}/reverse_questions.md"
      ],
      "verification": [
        "contains LogPulse",
        "contains IssuesTracker",
        "contains AI-assisted defense",
        "contains reverse questions"
      ],
      "requires_approval": false,
      "approval_status": "not_required"
    }
  ]
}
