{
  "name": "research_email_digest",
  "description": "Search sources, write a digest, draft/optionally send an email after approval.",
  "inputs": {
    "topic": {"required": true, "description": "Research topic"},
    "recipient": {"required": true, "description": "Email recipient"},
    "output_path": {"required": false, "default": "/tmp/agentflow-workflow-digest.md"}
  },
  "summary": "Research {{topic}}, write digest to {{output_path}}, then draft email to {{recipient}}.",
  "artifacts": ["{{output_path}}", "email:{{recipient}}"],
  "risks": ["External sources may be stale", "Email sending requires explicit approval"],
  "steps": [
    {
      "id": "search",
      "title": "Search web sources",
      "action": "Search the web for current reliable sources about {{topic}}. Return URLs and source notes.",
      "owner": "agentflow",
      "depends_on": [],
      "toolsets": ["web"],
      "expected_artifacts": ["source URLs"],
      "verification": ["at least 3 URLs", "each URL should be reachable"],
      "requires_approval": false,
      "approval_status": "not_required"
    },
    {
      "id": "write_digest",
      "title": "Write digest",
      "action": "Use the sources from search to write a concise Markdown digest to {{output_path}}.",
      "owner": "agentflow",
      "depends_on": ["search"],
      "toolsets": ["file"],
      "expected_artifacts": ["{{output_path}}"],
      "verification": ["markdown file exists", "contains source links"],
      "requires_approval": false,
      "approval_status": "not_required"
    },
    {
      "id": "send_email",
      "title": "Send email",
      "action": "Send the digest at {{output_path}} to {{recipient}} with a clear subject. If approval is not granted, do not send; draft only.",
      "owner": "agentflow",
      "depends_on": ["write_digest"],
      "toolsets": ["terminal"],
      "expected_artifacts": ["email message id or sent log for {{recipient}}"],
      "verification": ["recipient matches {{recipient}}", "message id or sent log exists"],
      "requires_approval": true,
      "approval_status": "pending"
    }
  ]
}
